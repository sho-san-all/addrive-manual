name: qa-sync

# Slackの📝リアクションで蓄積されたFAQを、マニュアルサイトの qa/log ページへ
# 自動反映するワークフロー。設計原典:
# docs/2026-08-04_FAQ自動反映パイプライン_設計.md（AD drive PJ リポジトリ側）
#
# 差分が無ければ commit/deploy をスキップする。VERCEL_TOKEN 未設定時は
# デプロイステップのみスキップし、取得→生成→commit まではブロッカーなしで完遂する。

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate qa/log.mdx from FAQ export API
        run: |
          python scripts/qa_export.py \
            --api-url "${{ vars.BACKEND_API_URL }}" \
            --token "${{ secrets.FAQ_EXPORT_TOKEN }}" \
            --output content/qa/log.mdx

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet content/qa/log.mdx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/qa/log.mdx
          git commit -m "chore(qa): FAQ自動反映（qa-sync workflow）"
          git push

      - name: Deploy to Vercel
        if: steps.diff.outputs.changed == 'true' && secrets.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN"
